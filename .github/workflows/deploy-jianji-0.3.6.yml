name: Deploy Jianji 0.3.6

on:
  push:
    paths:
      - .github/workflows/deploy-jianji-0.3.6.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-jianji-0.3.6
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified build delta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath '.deploy/jianji-0.3.6-delta.zip' -DestinationPath '.' -Force

          $staleAssets = @(
            'jianji/assets/main-5oVkt8pT.js',
            'jianji/assets/src-DsEl2Cel.js'
          )
          foreach ($asset in $staleAssets) {
            Remove-Item -LiteralPath $asset -Force -ErrorAction SilentlyContinue
          }

          Remove-Item -LiteralPath '.deploy/jianji-0.3.6-delta.zip' -Force
          Remove-Item -LiteralPath '.github/workflows/deploy-jianji-0.3.6.yml' -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) {
            Write-Host 'No deployment changes to commit.'
            exit 0
          }
          git commit -m 'Release Jianji 0.3.6'
          git push origin HEAD:main
